Cheat Sheet for PHYS291

------------------------------------------------------------------------
RUN root on our LAB machines ONLY:
root
               this runs root; to get out, type .q  (dot quit = .q )
------------------------------------------------------------------------

mkdir  NewDir        make a directory NewDir
cd NewDir            change your position to NewDir
pwd                  (where is my position? present working directory?)
nano newfil.txt        CTRL-O  write Output (follow instructions, by return for example)
                       CTRL-X  eXit   (asks if saving)
                       All commands are allways shown in the bottom   ^X means CTRL-X
ls            list
ls -l         list long
ls -ltr       list long arrange_by_TIME reverse (from old to newest)
ls -lr        list long  reverse  (from z to a )
ls -lR        R - recursive  - lists everyting in all directories 
ls -ltrR

mv            move    ( or simply RENAME )
cp            copy
rm            remove   all files listed behind
echo "hello there"                      ECHO whatever string "...  ... " 
echo "hello there"  >  newplay.txt      one  >   means send to file (new, or rewrite)
echo "goodbye there"  >>  newplay.txt   double >> means ADD to the previous txt, new line

ps
ps aux

ps aux | grep  myprog       ( grep is a search command; show only lines with myprog)

kill -9 3678            (if there is unwanted process, seen by ps - 3678 is PID = proc. ID

cat .bash_history          when pwd    is ~     (my home)             
cat ~/.bash_history        when pwd is anywhere
less ~/.bash_history       (  end it by letter q - when it shows (END)   )
