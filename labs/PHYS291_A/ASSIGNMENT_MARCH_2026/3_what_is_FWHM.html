FWHM  full width half maximum height 
HWHM  half width at half maximum - x at which the value of exp is 1/2
for the Gaussian standard parametrization:  
                
		exp(-x**2/(2*sigma**2)) == 1/2

                  x-value where it equals 1/2

		      x**2/(2*sigma**2) = ln 2

		       x = sqrt(2*ln(2))*sigma

             FWHM  = 2*x 
             FWHM  = 2*sqrt(2*ln(2))*sigma  
             FWHM  = 2.35*sigma

PHYS291 simplest Gaussian (unnormalized, simple exponential)

              exp(-p3*(x-p4)**2)  == exp(-(x-m)**2/(2*sigma**2))
              p3=1/(2*sigma**2)
              sigma=1/sqrt(2*p3)
///////////////////////////////////////
// in the code:
   peakPos=fitFun->GetParameter(4);
   peakVal=fitFun->GetParameter(2);
   sigma=1.0/sqrt(2.0*fitFun->GetParameter(3));     // sigma=1/sqrt(2*p3)
   widthpar=2.0*sqrt(2.0*log(2.0))*sigma;     //  FWHM  = 2*sqrt(2*ln(2))*sigma
