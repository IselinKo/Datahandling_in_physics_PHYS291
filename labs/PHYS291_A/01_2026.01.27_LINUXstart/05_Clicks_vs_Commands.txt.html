Some thoughts:
Anyway, unless one has some special experience, most people of your age communicate with 
computing devices by some sort of pointing, clicking, even voice actions.

It is easy to see that there must be some translation to commands, and there are some 
computer “programs”  behind this. Computer program now became "App"

Some 30 years ago, there were mostly commands as text, even some 20 years ago.
People working on computers did mainly typing, (nearly) no clicking

When the smart phones came, it influenced also the computers - and today the obvious points about 
the computer commands and programs are not so obvious and the real computing work has 
got a "new threshold" 

In normal computing device  there is always an "operating system" running, checking constantly 
all the interfaces to the outer world, as well as the inner subsystems. 
There is a central unit - fetching information from all the sources, 
"executing the programs of commands" on the incoming information - and taking actions, 
as commands to subsystems, storing information etc. 

This is happening in the smartphone, the laptop and the supercomputers evaluating the weather 
forecast for next week, as well as the electronic ssystems in CERN as we heard in the first lecture.

In this course you will be aware of the commands, programs, interfaces. The "clicking" remains 
a comfortable shorthand for lots of "commands", but only that.  Generally we do not learn how to 
click and what to click. 
Instead you will be encouraged to think about "what is really happening" in most situations.
