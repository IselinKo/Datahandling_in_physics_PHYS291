CTRL-ALT-T      open a terminal window

CTRL-ALT-T            - that created the window, started bash
ls -la
pwd 
                      - you "did something"
CTRL-D 
                  that closed the bash and the terminal
 
                  when the bash exits, it writes into
                  .bash_history
CTRL-ALT-T   
                  new terminal
ls -lart          
                  the bottom of the list will be
                  .bash_history
cat .bash_history 
cp  .bash_history first_hist.txt
                  here you hve copied the history
                  now you can explore it

history

ABOUT  ls -lart
ls -l        long list    (alphabet order)
ls -a        all files  (the dotted are listed too)
ls -lt       sort according to time - oldest last
ls -lr       reverse the sorting
             combined
ls -lart     long list, all files, time, newest last
