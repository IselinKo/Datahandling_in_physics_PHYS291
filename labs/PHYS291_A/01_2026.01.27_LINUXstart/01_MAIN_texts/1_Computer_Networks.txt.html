Addresses of computers; Communication by ssh

There is IPv4 and there is IPv6
most of the internet is still on v4, migration to v6 is going on 
(for already at least 5 years; it will not change this year)

v4: each computer is assigned an address consisting of 4 8-bit integers
largest 8 bit number (unsigned) is 255
the address could thus be up to
255.255.255.255  except that this is not allowed, neither is 0.0.0.0
(255 is never allowed, highest allowed would be 254.254.254.254)
