THIS YEAR, 2022 - we can start on the workstations 

THIS YEAR (2021) (as in the spring 2020) we must find new practical solutions.
WE ARE GOING TO USE MAINLY THE SAME COMPUTERS, BUT VIA THE NETWORK

You need to get especially used to 
  1. command line (data terminal communication)
     this exists also in windows as well as MacOS, but is not widely used
     It is no "rocket science", before 1990 EVERYBODY was using this.
     BUT IT MUST BE LEARNED - and become a part of your basic skills, 
     like reading and handwriting. Surprisingly, you "learn by doing" quite fast
     if you work with an instructor. Takes ages if you try reading books.

  2. Linux window system, Linux terminal, command "shell" - which is a funny name
     for the command language and its interpreter and executor. "Using the shell"
     (which is a program called 'bash') is simply the same as use the terminal for 
     anything. The program 'bash' runs in macOS and there is a similar "powershell"
     and cmd.exe in Windows. But you will "master" bash, in Linux, or if you wish,
     also in macOS. Again, you "learn by doing" quite fast if you work with 
     an instructor. But here asking google helps after a while.
     (Note: in addition to bash there are also sh, zsh, tcsh, ksh ... all of them 
     have the same basic common part but different further features - but they 
     are not always installed on all the systems.
     On my Mac there are all the listed ones, also on the lab's UiB linux are all these)

  3. World wide web, browsers, html, all that invented at CERN, and has been originally
     designed for communicating (physics) data. 
     You will document and present your project work (end of term) by using basic HTML,
     but it will be also trained in the first month.

  4. Modify your "user  environment", learn to compile programs, run programs, in simple
     examples. 
     But your programming and work will be in ROOT, which does not need 
     compilation, it is interpreted, just like Python or Perl or Ruby.
     ROOT runs in a terminal, and is incredibly versatile.
     All the experimental particle physics of the last 25 years done with ROOT
     
     Once you have the basic skills in these 4 points you can perhaps work more
     independently, but believe it, it helps to have a person to ask even then ....
