Removing - Deleting files and directories/folders

From our everyday use of present computers:

"Delete" means "move it to the recycler, dustbin, garbage bin ....."
and if you need the file, you can restore it ...

NOT IN COMMAND LINE

in cmd.exe     (windows)
del file.txt
REMOVES THE FILE AND IT'S  GONE FOR EVER

in Terminal.app, in linux/unix  (macOS sits on BSDunix)
rm file.txt
REMOVES THE FILE AND IT'S GONE FOR EVER

in linux in our working environment, we shall change that
the shell bash will ask if you really want to remove (or overwrite)


EVERYBODY EVERYWHERE
**********************************************************************
*                                                                    *
*  NEVER USE FILENAMES with SPACE    ( My useful file.txt )          *
*                                                                    *
*  NEVER USE FILENAMES containing National characters åøæü or @*     *
*                                                                    *
*  Recommended     file_new.txt    __even_this.txt 12345678_AbCd.txt *
*                                                                    *
*  "minus" allowed, but can cause problems in numerics file-1-2.txt  *
*  "plus" not recommended         min+yours-result.txt               *
*                                                                    *
