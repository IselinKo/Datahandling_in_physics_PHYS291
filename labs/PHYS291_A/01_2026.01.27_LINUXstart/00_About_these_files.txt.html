These files are a basic collection of our materials used with 
sometimes small, sometimes larger modifications, sometimes just 
copied - used and edited during the years 2016-2023
(before 2016 there was a different system, before mitt.uib.no) 

Some files carry the history from 2020 when the lab was suddenly 
closed in February 2020, just as comments.
-----------------------

the technical information should be correct.
-----------------------

but most of important changes are corrected.

in the exercise sessions
and we recommend
that you browse through them also during the rest of the week and 
perhaps point out unclear points or even possible errors - 
this could be also done in the "Discussions" which you can start 
in the course pages.
