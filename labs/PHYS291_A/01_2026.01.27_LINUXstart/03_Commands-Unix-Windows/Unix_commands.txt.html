#   commands which you use in Linux (macOS) Terminal

#   Do this - make a new directory/folder to avoid
#   messing up your other files
mkdir PHYS291_A
cd PHYS291_A

#   to make quickly a file , we do date > file.txt
#   the sign >  means send   output to a (new) file
#   the sign >> means append output to an  old file 

mkdir U
cd U
date > anyfile.txt

cp tt.txt gg.dat
mv gg.dat gg.txt
cd ..

#  look at present directory by GUI file manager
nautilus ./ &

# when on uib, Gnome, we  use   nautilus ./
# note the sign & - it means run "in background"

# open the directory U you made above 
nautilus U  &

#    help  is called  man on Unix
man ls
man more

cd ..

ls
ls -lrt
#  if output too long, use paging
ls -lrt | more      

#              on unix we also have less

# we can use a simple GUI editor (like notepad)
gedit commands.txt

mkdir most
cd most
date > a.txt
date > b.txt
date > c.txt

# and many more  (# is a remark, comment)
# on Windows we use REM instead of #

ls -lrt
cd ..
ls -l most
rm most/*
#  we shall configure it to asks for confirmation

rmdir most
# only empty directory can be removed

# renaming and moving files
mkdir funny
cd funny
date > a.dat
# rename the file - Unix use mv - same as move
mv a.dat ab.txt
#  you make one more txt file
date > bc.txt
# you want to move all txt files to a new directory
mkdir ../newdir
mv *.txt ../newdir
# ls gives you now empty
ls -l
cd ..
rmdir funny

# a simple way to  write to a file (new file)
# "cat" the input to the file

cat > aaa.txt
  I want to write into a file
  using this copy console to a file
  on unix they use cat
  try it now
  on windows copy con filename.txt
CTRL-D

#  You end the "cat > aaa.txt " by pressing CTRL-D 

# you wrote into a file aaa.txt
# to see what is in file     cat file.txt
# The result - print file to terminal

cat aaa.txt
  I want to write into a file
  using this copy console to a file
  on unix they use cat
  try it now
  on windows copy con filename.txt
