////////////////////////////////////////////////
struct    -   data type allowing to construct composite data structures
works in C   in C++    and in root

////////////     follows code
//a simple example: planets for "very simple" astronomy
// define
struct planet {char name[100]; double mass; double radius;};
// use
planet Venus;
//         Venus.name is empty, Venus.radius is zero

cout <<  Venus.name << endl;
strcpy(Venus.name,"Venus");
Venus.radius=0.55;          // of "some unit"
cout <<  Venus.name << endl;
cout <<  Venus.radius << endl;
//
//  define functions, need pointer to planet struct 
// 
void planetSetMass(planet* PL,double mass){PL->mass=mass;}
void planetSetName(planet* PL,char* nam){strcpy(PL->name,nam);}
void planetSetRadius(planet* PL,double rad){PL->radius=rad;}
void planetShow(planet* PL){cout<<PL->name<<":  mass="<<PL->mass<<" radius="<<PL->radius<<endl;}

planet Mars;
planetSetName( &Mars, "Venus" );
planetSetName( &Mars, "Mars" );
planetSetMass( &Mars, 0.35 );
planetSetMass( &Venus, 0.25 );
planetSetRadius( &Venus, 0.7 );
planetSetRadius( &Mars, 0.9 );
planetShow( &Mars)
planetShow( &Venus);
//  
//    This is struct   structure
//
